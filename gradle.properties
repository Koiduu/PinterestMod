org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties (https://fabricmc.net/develop)
# Override these on the command line to build for another Minecraft version, e.g.
#   ./gradlew build -Pminecraft_version=26.2 -Pfabric_version=0.157.0+26.2
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=net.koiduu.pinspo
archives_base_name=pinspo

# Dependencies
fabric_version=0.157.0+26.2

# The Minecraft range the built jar declares; a build is only safe on the version it compiled against.
minecraft_dependency=~26.2
